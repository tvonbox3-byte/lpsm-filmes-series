name: Gerar APK LPSM Filmes e Series
on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - "android/**"
      - ".github/workflows/build-apk.yml"
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Gerar APK Debug
        working-directory: android
        run: gradle assembleDebug --stacktrace
      - name: Preparar APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk LPSM-Filmes-Series.apk
      - uses: actions/upload-artifact@v4
        with:
          name: LPSM-Filmes-Series
          path: LPSM-Filmes-Series.apk
          retention-days: 30
