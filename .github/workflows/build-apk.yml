name: Gerar APK LPSM Filmes e Series

on:
  push:
    branches: [ main ]
    paths:
      - "android/**"
      - ".github/workflows/build-apk.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar projeto
        uses: actions/checkout@v4

      - name: Configurar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Gerar APK Debug
        working-directory: android
        run: gradle assembleDebug --stacktrace

      - name: Preparar APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk LPSM-Filmes-Series.apk

      - name: Enviar APK
        uses: actions/upload-artifact@v4
        with:
          name: LPSM-Filmes-Series
          path: LPSM-Filmes-Series.apk
