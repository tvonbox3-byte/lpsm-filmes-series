name: Gerar APK LPSM Filmes e Series

"on":
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    env:
      LPSM_VOD_KEYSTORE_PATH: ${{ github.workspace }}/lpsm-vod-release.jks
      LPSM_VOD_KEYSTORE_PASSWORD: ${{ secrets.LPSM_VOD_KEYSTORE_PASSWORD }}
      LPSM_VOD_KEY_ALIAS: ${{ secrets.LPSM_VOD_KEY_ALIAS }}
      LPSM_VOD_KEY_PASSWORD: ${{ secrets.LPSM_VOD_KEY_PASSWORD }}

    steps:
      - name: Baixar projeto
        uses: actions/checkout@v4

      - name: Configurar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Validar Secrets da assinatura
        env:
          KEYSTORE_B64: ${{ secrets.LPSM_VOD_KEYSTORE_BASE64 }}
        shell: bash
        run: |
          set -e
          test -n "$KEYSTORE_B64"
          test -n "$LPSM_VOD_KEYSTORE_PASSWORD"
          test -n "$LPSM_VOD_KEY_ALIAS"
          test -n "$LPSM_VOD_KEY_PASSWORD"

          printf '%s' "$KEYSTORE_B64" | tr -d '\r\n\t ' | base64 --decode > "$LPSM_VOD_KEYSTORE_PATH"

          test -s "$LPSM_VOD_KEYSTORE_PATH"

          keytool -list             -keystore "$LPSM_VOD_KEYSTORE_PATH"             -storepass "$LPSM_VOD_KEYSTORE_PASSWORD"             -alias "$LPSM_VOD_KEY_ALIAS"

          keytool -certreq             -alias "$LPSM_VOD_KEY_ALIAS"             -keystore "$LPSM_VOD_KEYSTORE_PATH"             -storepass "$LPSM_VOD_KEYSTORE_PASSWORD"             -keypass "$LPSM_VOD_KEY_PASSWORD"             -file /tmp/lpsm-test.csr

          rm -f /tmp/lpsm-test.csr

      - name: Definir versao
        id: version
        working-directory: android
        shell: bash
        run: |
          VERSION_NAME=$(grep -oP 'versionName\s*=\s*"\K[^"]+' app/build.gradle.kts)
          VERSION_CODE=$((100000 + GITHUB_RUN_NUMBER))
          echo "LPSM_VERSION_CODE=$VERSION_CODE" >> "$GITHUB_ENV"
          echo "name=$VERSION_NAME" >> "$GITHUB_OUTPUT"
          echo "code=$VERSION_CODE" >> "$GITHUB_OUTPUT"

      - name: Gerar APK Release assinado
        working-directory: android
        shell: bash
        run: gradle assembleRelease --stacktrace

      - name: Preparar APK
        shell: bash
        run: cp android/app/build/outputs/apk/release/app-release.apk LPSM-Filmes-Series.apk

      - name: Publicar artefato
        uses: actions/upload-artifact@v4
        with:
          name: LPSM-Filmes-Series-RELEASE
          path: LPSM-Filmes-Series.apk

      - name: Criar update.json
        env:
          VERSION_NAME: ${{ steps.version.outputs.name }}
          VERSION_CODE: ${{ steps.version.outputs.code }}
        shell: bash
        run: |
          SHA=$(sha256sum LPSM-Filmes-Series.apk | cut -d ' ' -f1)
          echo '{' > update.json
          echo '  "versionCode": '"$VERSION_CODE"',' >> update.json
          echo '  "versionName": "'"$VERSION_NAME"'",' >> update.json
          echo '  "apkUrl": "https://github.com/'"$GITHUB_REPOSITORY"'/releases/download/auto-update/LPSM-Filmes-Series.apk",' >> update.json
          echo '  "sha256": "'"$SHA"'"' >> update.json
          echo '}' >> update.json

      - name: Publicar canal de atualizacao
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION_NAME: ${{ steps.version.outputs.name }}
          VERSION_CODE: ${{ steps.version.outputs.code }}
        shell: bash
        run: |
          TAG=auto-update
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release edit "$TAG" --title "LPSM ${VERSION_NAME} build ${VERSION_CODE}"
          else
            gh release create "$TAG" --title "LPSM ${VERSION_NAME} build ${VERSION_CODE}" --notes "Canal automatico"
          fi
          gh release upload "$TAG" LPSM-Filmes-Series.apk update.json --clobber
