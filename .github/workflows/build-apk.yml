name: Build LPSM Filmes e Series

on:
  push:
    branches:
      - main
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    env:
      LPSM_VOD_KEYSTORE_PATH: ${{ github.workspace }}/lpsm-vod-release.jks
      LPSM_VOD_KEYSTORE_PASSWORD: ${{ secrets.LPSM_VOD_KEYSTORE_PASSWORD }}
      LPSM_VOD_KEY_ALIAS: ${{ secrets.LPSM_VOD_KEY_ALIAS }}
      LPSM_VOD_KEY_PASSWORD: ${{ secrets.LPSM_VOD_KEY_PASSWORD }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Validar assinatura
        env:
          KEYSTORE_B64: ${{ secrets.LPSM_VOD_KEYSTORE_BASE64 }}
        shell: bash
        run: |
          set -e

          if [ -z "$KEYSTORE_B64" ]; then
            echo "::error::LPSM_VOD_KEYSTORE_BASE64 esta vazio."
            exit 1
          fi

          if [ -z "$LPSM_VOD_KEYSTORE_PASSWORD" ]; then
            echo "::error::LPSM_VOD_KEYSTORE_PASSWORD esta vazio."
            exit 1
          fi

          if [ -z "$LPSM_VOD_KEY_ALIAS" ]; then
            echo "::error::LPSM_VOD_KEY_ALIAS esta vazio."
            exit 1
          fi

          if [ -z "$LPSM_VOD_KEY_PASSWORD" ]; then
            echo "::error::LPSM_VOD_KEY_PASSWORD esta vazio."
            exit 1
          fi

          printf '%s' "$KEYSTORE_B64" | tr -d '\r\n\t ' | base64 --decode > "$LPSM_VOD_KEYSTORE_PATH"

          if [ ! -s "$LPSM_VOD_KEYSTORE_PATH" ]; then
            echo "::error::Falha ao reconstruir a keystore."
            exit 1
          fi

          keytool -list             -keystore "$LPSM_VOD_KEYSTORE_PATH"             -storepass "$LPSM_VOD_KEYSTORE_PASSWORD"             -alias "$LPSM_VOD_KEY_ALIAS" >/dev/null

          keytool -certreq             -alias "$LPSM_VOD_KEY_ALIAS"             -keystore "$LPSM_VOD_KEYSTORE_PATH"             -storepass "$LPSM_VOD_KEYSTORE_PASSWORD"             -keypass "$LPSM_VOD_KEY_PASSWORD"             -file /tmp/lpsm-test.csr >/dev/null

          rm -f /tmp/lpsm-test.csr
          echo "Assinatura validada."

      - name: Definir versao
        id: version
        working-directory: android
        shell: bash
        run: |
          VERSION_NAME=$(grep -oP 'versionName\s*=\s*"\K[^"]+' app/build.gradle.kts)
          VERSION_CODE=$((100000 + GITHUB_RUN_NUMBER))

          echo "LPSM_VERSION_CODE=$VERSION_CODE" >> "$GITHUB_ENV"
          echo "name=$VERSION_NAME" >> "$GITHUB_OUTPUT"
          echo "code=$VERSION_CODE" >> "$GITHUB_OUTPUT"

      - name: Gerar APK Release assinado
        working-directory: android
        shell: bash
        run: |
          gradle assembleRelease --stacktrace

      - name: Confirmar assinatura do APK
